name: Student Registry CI

on:
  push:
    branches: [main]
    paths:
      - "5.Exersice-CI-CD-GitHub-Actions/01-02-Student-Registry-App/**"
      - ".github/workflows/student-registry-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "5.Exersice-CI-CD-GitHub-Actions/01-02-Student-Registry-App/**"
      - ".github/workflows/student-registry-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 5.Exersice-CI-CD-GitHub-Actions/01-02-Student-Registry-App

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: nohup npm start > /tmp/student-registry.log 2>&1 &

      - name: Wait for application
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/student-registry.log
          echo "Application did not start"
          exit 1

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STUDENT_REGISTRY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.STUDENT_REGISTRY_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_TOKEN }}
          