name: Library Catalog CI/CD

on:
  push:
    branches: [main]
    paths:
      - "5.Exersice-CI-CD-GitHub-Actions/03-Library/**"
      - ".github/workflows/library-catalog-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "5.Exersice-CI-CD-GitHub-Actions/03-Library/**"
      - ".github/workflows/library-catalog-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: 5.Exersice-CI-CD-GitHub-Actions/03-Library

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application and API
        run: |
          nohup npm run server > /tmp/library-api.log 2>&1 &
          nohup npm start > /tmp/library-app.log 2>&1 &

      - name: Wait for servers
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/localhost/3030) 2>/dev/null &&
               (echo > /dev/tcp/localhost/3000) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/library-api.log /tmp/library-app.log
          echo "Servers did not start in time"
          exit 1

      - name: Run Playwright tests
        run: npm test -- --workers=1

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LIBRARY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.LIBRARY_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_TOKEN }}